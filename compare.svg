<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compare-title compare-desc" id="compare-root">
<title id="compare-title">curl versus no-api-search on the same search and three URLs</title>
<desc id="compare-desc">For a Google search, curl gets a JavaScript redirect with no results while no-api-search returns ranked results with titles, URLs and snippets. For an Airbnb search page, an arXiv PDF and a bot-walled G2 page, curl returns script-heavy HTML, compressed PDF binary and a 403 block page, while no-api-search returns readable markdown with listings, the paper text and the review ratings.</desc>
