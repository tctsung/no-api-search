<text x="40" y="266" fill="#9a9a9a" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="start" xml:space="preserve">%PDF-1.5 %. 137 0 obj &lt;&lt; /Filter /FlateDecode /Length 4011 &gt;&gt; str…</text>
