<text x="40" y="182" fill="#9a9a9a" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="start" xml:space="preserve">&lt;!doctype html&gt;&lt;html&gt;&lt;html lang=&quot;en&quot; dir=&quot;ltr&quot; data-is-hyperloop=…</text>
