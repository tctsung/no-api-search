<text x="508" y="98" fill="#f5f5f5" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="start" xml:space="preserve">1. dataclasses — Data Classes — Python 3.15.2 documentation</text>
