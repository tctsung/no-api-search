<title id="bench-title">Tokens and seconds per page, curl and fetch_url</title>
<desc id="bench-desc">Across 21 pages that both tools could read, fetch_url returned 9.6 percent of curl's tokens on average, standard deviation 14.2. Across 30 pages, a curl call took 0.35 seconds on average and a fetch_url call 4.7 seconds.</desc>
